# Which Azure service this site browses: 'file_share' (Azure Files - works on
# both FileStorage and StorageV2 accounts) or 'blob' (Blob Storage - StorageV2
# accounts only). Defaults to file_share. Override per environment in
# settings.php.
storage_backend: 'file_share'
azure_account_name: ''
azure_account_key: ''
azure_container_name: ''
azure_blob_prefix: ''
# Local development only: point the services at tools/azure-storage-mock.
# Empty means the production Azure endpoint. Set these in settings.local.php.
azure_blob_endpoint: ''
azure_file_endpoint: ''
azure_share_name: ''
azure_directory_path: ''
allowed_extensions: ''
page_title: 'Available Files'
show_file_size: true
show_last_modified: true
