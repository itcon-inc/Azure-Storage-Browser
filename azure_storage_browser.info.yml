name: 'Azure Storage Browser'
description: 'Browse and download files from Azure Blob Storage or Azure Files (e.g. database backups). The backend is selected by configuration; downloads are proxied through Drupal.'
package: 'Custom'
type: module
core_version_requirement: ^11
configure: azure_storage_browser.settings
php: '>=8.4'
dependencies:
  - drupal:system
