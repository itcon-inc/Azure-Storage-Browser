azure_storage_browser.settings:
  path: '/admin/config/azure-storage-browser'
  defaults:
    _form: '\Drupal\azure_storage_browser\Form\AzureStorageBrowserSettingsForm'
    _title: 'Azure Storage Browser Settings'
  requirements:
    _permission: 'administer azure storage browser'

# One listing route for either backend — which one is served is decided by the
# storage_backend setting, not by the URL.
azure_storage_browser.list:
  path: '/admin/azure-storage'
  defaults:
    _controller: '\Drupal\azure_storage_browser\Controller\AzureStorageBrowserController::listFiles'
    _title_callback: '\Drupal\azure_storage_browser\Controller\AzureStorageBrowserController::title'
  requirements:
    _permission: 'access azure storage browser'

azure_storage_browser.download:
  path: '/admin/azure-storage/download/{file}'
  defaults:
    _controller: '\Drupal\azure_storage_browser\Controller\AzureStorageBrowserController::downloadFile'
    _title: 'Download'
  requirements:
    _permission: 'access azure storage browser'
  options:
    utf8: true
