azure_storage_browser.settings:
  path: '/admin/config/azure-storage-browser'
  defaults:
    _form: '\Drupal\azure_storage_browser\Form\AzureStorageBrowserSettingsForm'
    _title: 'Azure Storage Browser Settings'
  requirements:
    _permission: 'administer azure storage browser'

azure_storage_browser.list:
  path: '/admin/azure-storage'
  defaults:
    _controller: '\Drupal\azure_storage_browser\Controller\AzureStorageBrowserController::listFiles'
    _title: 'Azure Storage Browser'
  requirements:
    _permission: 'access azure storage browser'

azure_storage_browser.download:
  path: '/admin/azure-storage/download/{blob}'
  defaults:
    _controller: '\Drupal\azure_storage_browser\Controller\AzureStorageBrowserController::downloadFile'
    _title: 'Download Azure Object'
  requirements:
    _permission: 'access azure storage browser'
  options:
    utf8: true

azure_storage_browser.file_share.list:
  path: '/admin/azure-storage/files'
  defaults:
    _controller: '\Drupal\azure_storage_browser\Controller\AzureFileShareController::listFiles'
    _title: 'Azure File Share Browser'
  requirements:
    _permission: 'access azure storage browser'

azure_storage_browser.file_share.download:
  path: '/admin/azure-storage/files/download/{file}'
  defaults:
    _controller: '\Drupal\azure_storage_browser\Controller\AzureFileShareController::downloadFile'
    _title: 'Download Azure File'
  requirements:
    _permission: 'access azure storage browser'
  options:
    utf8: true
